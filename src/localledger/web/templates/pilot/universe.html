{% extends "base.html" %}
{% block title %}Universe · {{ brand() }}{% endblock %}
{% block content %}
<div class="flex items-baseline justify-between gap-4 flex-wrap">
  <h1 class="text-xl font-semibold">Coverage universe</h1>
  <p class="text-sm text-slate-500"><span id="count" class="num">{{ companies|length }}</span> companies</p>
</div>
<form class="mt-4 grid gap-2 grid-cols-2 md:grid-cols-6 text-sm" hx-get="/app/universe" hx-target="#rows" hx-trigger="change, keyup changed delay:300ms from:input[name=q]" hx-push-url="true">
  <input name="q" value="{{ f.q }}" placeholder="ticker or name" class="border border-slate-300 rounded px-2 py-1.5 col-span-2 md:col-span-1">
  <select name="archetype" class="border border-slate-300 rounded px-2 py-1.5 col-span-2"><option value="">all archetypes</option>{% for a in archetypes %}<option {{ 'selected' if f.archetype == a }}>{{ a }}</option>{% endfor %}</select>
  <select name="coverage" class="border border-slate-300 rounded px-2 py-1.5"><option value="">any coverage</option>{% for c in coverages %}<option {{ 'selected' if f.coverage == c }}>{{ c }}</option>{% endfor %}</select>
  <select name="size" class="border border-slate-300 rounded px-2 py-1.5"><option value="">any size</option>{% for s in sizes %}<option {{ 'selected' if f.size == s }}>{{ s }}</option>{% endfor %}</select>
  <select name="min_priority" class="border border-slate-300 rounded px-2 py-1.5"><option value="0">any priority</option>{% for p in [9, 8, 7, 6] %}<option value="{{ p }}" {{ 'selected' if f.min_priority == p }}>priority ≥ {{ p }}</option>{% endfor %}</select>
</form>
<div class="mt-3 overflow-x-auto">
<table class="w-full text-sm border-collapse">
  <thead><tr class="text-left border-b border-slate-300 text-slate-600 text-xs uppercase tracking-wide">
    <th class="py-2 pr-2">Ticker</th><th class="pr-2">Company</th><th class="pr-2 text-right">Mkt cap</th><th class="pr-2">Archetype</th><th class="pr-2">Coverage</th><th class="pr-2 text-right">Priority</th><th class="pr-2 text-right">Signals</th><th class="pr-2">Latest</th></tr></thead>
  <tbody id="rows">{% include "pilot/_universe_rows.html" %}</tbody>
</table>
</div>
{% endblock %}
