<form hx-post="/waitlist" hx-target="this" hx-swap="outerHTML" method="post" action="/waitlist" class="mt-3 grid gap-2 sm:grid-cols-2 text-sm">
  <input name="email" type="email" required placeholder="work email" class="border border-slate-300 rounded px-3 py-2 sm:col-span-2">
  <input name="name" placeholder="name (optional)" class="border border-slate-300 rounded px-3 py-2">
  <input name="firm" placeholder="firm (optional)" class="border border-slate-300 rounded px-3 py-2">
  <select name="role" class="border border-slate-300 rounded px-3 py-2 sm:col-span-2">
    <option value="">role (optional)</option><option>Portfolio manager</option><option>Analyst</option><option>Allocator</option><option>Individual investor</option><option>Other</option>
  </select>
  <button class="bg-ledger-700 text-white rounded px-3 py-2 font-medium sm:col-span-2">Join the waitlist</button>
</form>
