# Curated overlay (Claude Code). Gyrodyne reports on the liquidation basis, so it's valued on net assets in liquidation.
note: "Liquidation basis: value = estimated distributions per share; entitlements at Flowerfield (Smithtown) and Cortlandt Manor drive sale timing."
