# Simple driver model for TRC (calendar year). Updated versions are written to out/models/TRC.yaml.
ticker: TRC
basis: calendar quarter
units: USD millions unless noted
drivers:
  - {name: revenues_and_other_income, unit: USD millions, value: 11.1, kpi_aliases: ["revenues and other income", "total revenues"]}
  - {name: net_income_to_common, unit: USD millions, value: -1.7, kpi_aliases: ["net income attributable", "net income"]}
  - {name: adjusted_ebitda, unit: USD millions, value: 5.7, kpi_aliases: ["adjusted ebitda"]}
  - {name: commercial_industrial_revenue, unit: USD millions, value: 5.1, kpi_aliases: ["commercial/industrial", "segment revenues"]}
  - {name: mineral_resources_revenue, unit: USD millions, value: 1.5, kpi_aliases: ["mineral resources"]}
  - {name: farming_revenue, unit: USD millions, value: 0.6, kpi_aliases: ["farming"]}
  - {name: trcc_industrial_occupancy, unit: "%", value: 100, kpi_aliases: ["industrial portfolio", "leased"]}
  - {name: terra_vista_leased, unit: "%", value: null, kpi_aliases: ["terra vista"]}
  - {name: total_liquidity, unit: USD millions, value: null, kpi_aliases: ["liquidity"]}
