# Curated overlay + war-room driver model (Claude Code). Drivers feed the war room; events and notes feed the company model.
ticker: TRC
basis: calendar quarter
units: USD millions unless noted
drivers:
- name: revenues_and_other_income
  unit: USD millions
  value: 11.1
  kpi_aliases:
