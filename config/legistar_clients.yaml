# Legistar Web API clients -> universe tickers. One line per client (flow-style mapping).
# API: https://webapi.legistar.com/v1/{client}/bodies | /events | /events/{id}/eventitems | /matters (no key for
# most clients; webapi.legistar.com has no robots.txt, i.e. 4xx = allow under RFC 9309).
# status: ok (fetched) | token_required (HTTP 403 "Token is required": we don't use tokens) | not_found (HTTP 500
#   "LegistarConnectionString setting is not set up in InSite for client") | stale (answers, but no current data).
# mode: events (default; /events + /eventitems) | matters (/matters filtered on MatterAgendaDate, for clients whose
#   /events returns HTTP 400 "'Agenda Draft Status' ... is not setup in settings").
# bodies: optional list of body-name substrings to keep. Citations go to the public InSite meeting/legislation page
#   on {client}.legistar.com (the agenda PDFs live on {client}.legistar1.com, whose robots.txt disallows all agents,
#   so we cite but never fetch them).
# All statuses verified 2026-10-17 with the declared User-Agent.
clients:
  - {client: mauicounty, name: "Maui County, HI", tickers: [MLP], status: ok, why: "County Council and committees decide Kapalua/West Maui entitlements, zoning bills and water (Honokohau) items"}
